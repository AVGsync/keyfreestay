services:
  postgres:
    image: postgres:16-alpine
    container_name: keyfreestay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app_net]

  minio:
    image: minio/minio
    container_name: keyfreestay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

  postgres-migrate:
    image: migrate/migrate:latest
    container_name: keyfreestay-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command: [
      "-path=/migrations",
      "-database",
      "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
      "up"
    ]
    networks: [app_net]
    restart: "no"

  backend:
    build: ./backend
    container_name: keyfreestay-backend
    restart: unless-stopped
    env_file: .env
    environment:
      BIND_ADDR: ${BIND_ADDR}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ENDPOINT: minio:9000
      PUBLIC_URL: ${PUBLIC_URL}
      USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    networks: [app_net]

  landing:
    build:
      context: ./frontend/keyfreestay-landing
      target: prod
    container_name: keyfreestay-landing
    restart: unless-stopped
    depends_on: [backend]
    networks: [app_net]

  app:
    build:
      context: ./frontend/keyfreestay-app
      target: prod
    container_name: keyfreestay-app
    restart: unless-stopped
    depends_on: [backend]
    networks: [app_net]

  edge:
    image: nginx:1.27-alpine
    container_name: keyfreestay-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/song-ify.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/keyfreestay/certs:/etc/nginx/certs:ro
      - /var/www/acme:/var/www/acme:ro
    depends_on:
      - landing
      - app
      - backend
      - minio
    networks: [app_net]

  # ── dev profile: `docker compose --profile dev up` ───────────────────────
  landing-dev:
    profiles: [dev]
    build:
      context: ./frontend/keyfreestay-landing
      target: dev
    container_name: keyfreestay-landing-dev
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/keyfreestay-landing:/app
      - /app/node_modules
    depends_on: [backend]
    networks: [app_net]

  app-dev:
    profiles: [dev]
    build:
      context: ./frontend/keyfreestay-app
      target: dev
    container_name: keyfreestay-app-dev
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5174:5174"
    volumes:
      - ./frontend/keyfreestay-app:/app
      - /app/node_modules
    depends_on: [backend]
    networks: [app_net]

  swagger:
    profiles: [swagger]
    build:
      context: ./backend
      dockerfile: Dockerfile.swagger
    volumes:
      - ./backend:/code

networks:
  app_net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
